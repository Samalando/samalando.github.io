<!DOCTYPE html>
<html lang="en-us">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Mulish:ital,wght@0,200..1000;1,200..1000&display=swap');
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;

  }
  .header {
    border-radius: 10px;
    background-color: #7cda60;
    color: #fff;
    padding: 5px 0;
    box-shadow: 0 6px 4px rgba(0, 0, 0, 0.2);

  }

  body {
    font-family: 'Mulish', sans-serif;
    background:
            radial-gradient(circle at 20% 20%, #81c0ca 0%, transparent 50%),
            radial-gradient(circle at 80% 80%, #9b90e4 0%, transparent 50%),
            radial-gradient(circle at 40% 70%, #93a4e6 0%, transparent 50%),
            #5586d5;
    background-size: 300% 300%, 250% 250%, 400% 400%, 100% 100%;
    animation: flow 15s ease-in-out infinite;
    min-height: 100vh;
  }

  @keyframes flow {
    0%, 100% {
      background-position: 0% 0%, 100% 100%, 50% 50%, 0% 0%;
    }
    33% {
      background-position: 100% 50%, 0% 50%, 80% 20%, 0% 0%;
    }
    66% {
      background-position: 50% 100%, 50% 0%, 20% 80%, 0% 0%;
    }
  }
</style>
  <head>
    <meta charset="utf-8">
   
    <title>o/</title>
  </head>

  <div class="header">
    <div style=".header">
      <h1>o/</h1>
    </div>
