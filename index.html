<!DOCTYPE html>
<html lang="en-us">
<style>
    @font-face {
        font-family: 'Mulish';
        src: url('fonts/Mulish/static/Mulish-Bold.ttf') format('truetype');
        font-weight: normal;
        font-style: normal;
    }

    @font-face {
        font-family: 'Open-Dyslexic';
        src: url('fonts/opendyslexic/OpenDyslexic-Regular.otf') format('truetype');
        font-weight: normal;
        font-style: normal;
    }
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;

    }

    .header {
        display: flex;
        gap: 15%;
        border-radius: 0 0 10px 10px;
        background-color: rgba(79, 169, 243, 0.5);
        color: #fff;
        padding: 20px 5px;
        box-shadow: 0 6px 4px rgba(0, 0, 0, 0.2);
        backdrop-filter: blur(5px);

    }

    .button {
        border: #9e8dc3 1px;
        border-radius: 10px;
        background-color: #ac93da;
        color: #fff;
        padding: 8px;
        width: 30%;
        box-shadow: 0 6px 10px rgba(0, 0, 0, 0.2);
    }

    body {
        font-family: 'Mulish', sans-serif;
        background: #89a2f3;
        min-height: 100vh;
        display: flex;
        /*align-items: stretch;*/
        justify-content: space-between;
        flex-direction: column;
        margin: 0;
        padding: 0;
    }

    body.dyslexic-mode{
        font-family: 'Open-Dyslexic', sans-serif;
    }
    body.dyslexic-mode h1{
        font-size: 28px;
    }

    body.dark-mode {
        background: #4d587a;
        color: white;
    }

    .font-selector{
        position: static;
        top: 10px;
        left: 10px;
        font-family: 'Open-Dyslexic',serif;
        width: auto;
        display: inline-block;
    }


    .dark-mode-btn{
        position: absolute;
        top: 73px;
        right: 10px;
        width: auto;
        display: inline-block;
    }

    .card {
        width: 100%;
        max-width: 800px;
        display: flex;
        justify-content: space-evenly;
        gap: 100px;
        padding: 40px 60px;
        background: rgba(255, 255, 255, 0.21);
        border-radius: 16px;
        box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        backdrop-filter: blur(9.4px);
        -webkit-backdrop-filter: blur(9.4px);
        border: 1px solid rgba(255, 255, 255, 0.28);
    }

    .card-container {
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 30px;
        padding: 30px 0;
    }

    .card:nth-child(odd) {
        align-self: flex-start;
        margin-left: 0;
        border-radius: 0 160px 160px 0px;
        
    }

    .card:nth-child(even) {
        align-self: flex-end;
        margin-right: 0;
        border-radius: 160px 0  0 160px;
    }

    .card-all-text {
        display: flex;
        flex: 1;
        align-items: flex-start;
        flex-direction: column;

    }

    .card-title {
        display: flex;
        margin: 0;
        align-items: flex-end;
    }

    .card-title h1 {
        font-size: 50px;
        font-weight: bold;
    }

    .card-text {
        padding: 16px;
        display: flex;
        align-items: center;
    }
    button {
        width: 100%;
        background: none;
        border: none;
    }
</style>
<head>
    <meta charset="utf-8">

    <title>o/</title>
</head>

<body>

    <div class="header">
        <button class="button" onclick="document.location='#'">About Me</button>
        <button class="button" onclick="document.location='projects/'">Projects</button>
        <button class="button" onclick="document.location='contact-me'">Contact Me</button>
    </div>
    <div class="font-selector">
        <button id="font-toggle" class="font-selector"> <h4>dyslexic mode</h4> </button>
    </div>
    <div class="dark-mode-btn">
        <button id="dark-toggle" class="dark-mode"> <svg width="20px" height="20px" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">

            <path d="M14,24A10,10,0,0,0,24,34V14A10,10,0,0,0,14,24Z"/>
            <path d="M24,2A22,22,0,1,0,46,24,21.9,21.9,0,0,0,24,2ZM6,24A18.1,18.1,0,0,1,24,6v8a10,10,0,0,1,0,20v8A18.1,18.1,0,0,1,6,24Z"/>

        </svg> </button>
    </div>
    <script src="scripts/fontswap.js"></script>
    
    <div class="card-container">
        <div class="card">
            <div class="card-all-text">
                <h1 class="card-title"> Hi!</h1>
                <p class="card-text"> Welcome to my website, hope you enjoy it!</p>
            </div>
        </div>

        <div class="card">
            <div class="card-all-text">
                <h1 class="card-title"> About me</h1>
                <p class="card-text"> I'm Samalando, he/him/his. Nice to meet you :3</p>
            </div>
        </div>

        <div class="card">
            <div class="card-all-text">
                <h1 class="card-title"> <img src="https://cdn.discordapp.com/emojis/1224413160472318082.webp?size=100&animated=true" sizes="50">  </h1>
            </div>
        </div>

        <div class="card">
            <div class="card-all-text">
                <h1 class="card-title"> Source code?</h1>
                <p class="card-text"><a href="https://github.com/Samalando/samalando.github.io">Found here :3 </a></p>
            </div>
        </div>


        <div class="card">
            <div class="card-all-text">
                <h1 class="card-title">How can I contact you or give you money?</h1>
                <h3 class="card-text"><a href="contacts.html"> Here :3 </a></h3>
            </div>
        </div>
    </div>


    

    


</body>
</html>
